/* ============================================================
   AUDIO CONTEXT
   ============================================================ */
let audioCtx = null, master = null, reverbBus = null;
function initAudio(){
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  master = audioCtx.createGain();
  master.gain.value = 0.7;
  master.connect(audioCtx.destination);
  const len = Math.floor(audioCtx.sampleRate * 2.8);
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let c=0;c<2;c++){
    const d = buf.getChannelData(c);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.3);
  }
  const conv = audioCtx.createConvolver(); conv.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
  const wet = audioCtx.createGain(); wet.gain.value = 0.45;
  const dry = audioCtx.createGain(); dry.gain.value = 0.75;
  reverbBus = audioCtx.createGain();
  reverbBus.connect(dry); dry.connect(master);
  reverbBus.connect(conv); conv.connect(lp); lp.connect(wet); wet.connect(master);
}

const BGM = {
  master: null,
  current: null,
  currentName: null,
  timer: null,
  notesAlive: [],

  init(){
    if (!audioCtx || this.master) return;
    this.master = audioCtx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(master);
  },

  play(name){
    if (!audioCtx || !this.master) return;
    if (this.currentName === name) return;
    this.currentName = name;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    const now = audioCtx.currentTime;
    for (const n of this.notesAlive){
      try { n.gain.gain.cancelScheduledValues(now); n.gain.gain.linearRampToValueAtTime(0, now + 1.2); } catch(e){}
      try { n.osc.stop(now + 1.4); } catch(e){}
    }
    this.notesAlive = [];
    if (!name || !MOODS[name]) { this.current = null; return; }
    this.current = MOODS[name];
    this.scheduleLoop();
  },

  stop(){
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    const now = audioCtx ? audioCtx.currentTime : 0;
    for (const n of this.notesAlive){
      try { n.gain.gain.cancelScheduledValues(now); n.gain.gain.linearRampToValueAtTime(0, now + 0.8); } catch(e){}
      try { n.osc.stop(now + 1.0); } catch(e){}
    }
    this.notesAlive = [];
    this.current = null;
    this.currentName = null;
  },

  scheduleLoop(){
    if (!this.current) return;
    const mood = this.current;
    const loopMs = mood.chords.length * mood.tempo;
    this.playPhrase(mood);
    this.timer = setTimeout(()=> this.scheduleLoop(), loopMs - 100);
  },

  playPhrase(mood){
    const t0 = audioCtx.currentTime + 0.05;
    mood.chords.forEach((chord, i) => {
      const startT = t0 + i * mood.tempo / 1000;
      const dur = (mood.tempo / 1000) * 0.98;
      for (const f of chord.pad){
        this.padNote(f, startT, dur, mood.padVol);
      }
      this.bassNote(chord.bass, startT, dur * 0.85, mood.bassVol);
    });
    if (mood.melody){
      for (const m of mood.melody){
        this.pianoNote(m.n, t0 + m.t, m.d, m.v);
      }
    }
  },

  padNote(freq, startT, dur, vol){
    const o1 = audioCtx.createOscillator(); o1.type='sine'; o1.frequency.value=freq;
    const o2 = audioCtx.createOscillator(); o2.type='sine'; o2.frequency.value=freq*1.004;
    const o3 = audioCtx.createOscillator(); o3.type='triangle'; o3.frequency.value=freq*0.5;
    const g3 = audioCtx.createGain(); g3.gain.value = 0.35;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, startT);
    env.gain.linearRampToValueAtTime(vol, startT + 1.2);
    env.gain.setValueAtTime(vol, startT + Math.max(1.2, dur - 1.2));
    env.gain.linearRampToValueAtTime(0, startT + dur);
    o1.connect(env); o2.connect(env); o3.connect(g3); g3.connect(env);
    env.connect(this.master);
    o1.start(startT); o2.start(startT); o3.start(startT);
    o1.stop(startT + dur + 0.1);
    o2.stop(startT + dur + 0.1);
    o3.stop(startT + dur + 0.1);
    this.notesAlive.push({ osc: o1, gain: env });
  },

  pianoNote(freq, startT, dur, vol){
    const o1 = audioCtx.createOscillator(); o1.type='triangle'; o1.frequency.value=freq;
    const o2 = audioCtx.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.01;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.30;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, startT);
    env.gain.linearRampToValueAtTime(vol, startT + 0.012);
    env.gain.linearRampToValueAtTime(vol*0.5, startT + 0.18);
    env.gain.exponentialRampToValueAtTime(0.0005, startT + dur);
    o1.connect(env); o2.connect(g2); g2.connect(env);
    env.connect(this.master); env.connect(reverbBus);
    o1.start(startT); o1.stop(startT + dur + 0.05);
    o2.start(startT); o2.stop(startT + dur + 0.05);
    this.notesAlive.push({ osc: o1, gain: env });
  },

  bassNote(freq, startT, dur, vol){
    const o1 = audioCtx.createOscillator(); o1.type='sine'; o1.frequency.value=freq;
    const o2 = audioCtx.createOscillator(); o2.type='triangle'; o2.frequency.value=freq*2;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.12;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, startT);
    env.gain.linearRampToValueAtTime(vol, startT + 0.08);
    env.gain.linearRampToValueAtTime(vol*0.65, startT + 0.6);
    env.gain.exponentialRampToValueAtTime(0.0006, startT + dur);
    o1.connect(env); o2.connect(g2); g2.connect(env);
    env.connect(this.master);
    o1.start(startT); o2.start(startT);
    o1.stop(startT + dur + 0.05);
    o2.stop(startT + dur + 0.05);
    this.notesAlive.push({ osc: o1, gain: env });
  },
};

    this.startedA = true;
    BGM.stop();
    if (this.a && this.a.paused){
      this.a.currentTime = 0;
      this.a.play().catch(()=>{});

    if (this.startedB) return;
    this.startedB = true;
    BGM.stop();
    if (this.b){
      this.b.currentTime = 0;
      this.b.play().catch(()=>{});
    }
    if (this.a){
      const fadeOut = setInterval(()=>{
        if (this.a.volume > 0.05) this.a.volume = Math.max(0, this.a.volume - 0.05);
        else { this.a.pause(); clearInterval(fadeOut); }
      }, 100);
    }
  },
};

   SFX
   ============================================================ */
function blip(pitch=520, vol=0.008){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type='square'; o.frequency.value = pitch;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0004, t+0.035);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+0.04);
}
function heartbeat(vol=1){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 0.13].forEach(off=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.setValueAtTime(70, t+off);
    o.frequency.exponentialRampToValueAtTime(30, t+off+0.14);
    g.gain.setValueAtTime(0, t+off);
    g.gain.linearRampToValueAtTime(0.14*vol, t+off+0.010);
    g.gain.exponentialRampToValueAtTime(0.0008, t+off+0.20);
    o.connect(g); g.connect(master);
    o.start(t+off); o.stop(t+off+0.22);
  });
}
function flatline(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sine'; o.frequency.value = 1000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.10, t+0.05);
  g.gain.setValueAtTime(0.10, t+5.5);
  g.gain.linearRampToValueAtTime(0, t+6);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+6.1);
}
function chime(){
  if (!audioCtx) return;
  [523.25, 659.25, 783.99, 1046.50].forEach((f, i)=>{
    setTimeout(()=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.06/(i+1), audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0005, audioCtx.currentTime + 2.5);
      o.connect(g); g.connect(reverbBus);
      o.start(); o.stop(audioCtx.currentTime + 2.6);
    }, i*140);
  });
}
function thunder(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const size = audioCtx.sampleRate * 2.5;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<size;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 1.8);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.38, t+0.15);
  g.gain.exponentialRampToValueAtTime(0.001, t+2.4);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t);
}
function wind(dur=6){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const size = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<size;i++) d[i] = (Math.random()*2-1);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.04, t+1);
  g.gain.linearRampToValueAtTime(0.04, t+dur-1);
  g.gain.linearRampToValueAtTime(0, t+dur);
  src.connect(lp); lp.connect(g); g.connect(reverbBus);
  src.start(t); src.stop(t+dur+0.1);
}
function paperRustle(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const dur = 1.2;
  const size = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<size;i++) d[i] = (Math.random()*2-1);

/* ============================================================
   GRADIENTS
   ============================================================ */
function gradV(y0,y1, stops){
  const g = ctx.createLinearGradient(0,y0,0,y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function gradR(cx,cy,r0,r1, stops){
  const g = ctx.createRadialGradient(cx,cy,r0,cx,cy,r1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}

function hasChar(id){
  const s = STORY[G.storyIdx];
  if (!s || !s.chars) return false;
  return s.chars.includes(id);
}

/* ============================================================
   HOSPITAL — Nanay lying properly on the bed
   ============================================================ */
function sceneHospital(){
  // Wall
  ctx.fillStyle = gradV(0, H*0.75, [[0,'#1a2430'],[1,'#0a1018']]);
  ctx.fillRect(0,0,W,H*0.75);
  // Floor
  ctx.fillStyle = gradV(H*0.75, H, [[0,'#0e1418'],[1,'#050708']]);
  ctx.fillRect(0, H*0.75, W, H*0.25);
  // Fluorescent light
  ctx.fillStyle = gradR(W/2, 0, 20, 300, [[0,'rgba(180,210,240,0.35)'],[1,'rgba(180,210,240,0)']]);
  ctx.fillRect(0,0,W,H);
  R(W*0.3, 40, W*0.4, 6, '#0a1018');
  R(W*0.32, 42, W*0.36, 2, '#c8d8e0');

  // ===== BED =====
  const bedX = 40;
  const bedY = H*0.55;       // top of mattress
  const bedW = 280;
  const bedH = 30;            // mattress thickness
  const legH = 60;
  const legY = bedY + bedH;

  // Bed frame (metal, thin dark line)
  R(bedX - 6, bedY - 4, bedW + 12, 6, '#1a1e24'); // headboard top bar
  R(bedX - 4, bedY - 4, 6, bedH + 20, '#1a1e24'); // left rail
  R(bedX + bedW - 2, bedY - 4, 6, bedH + 20, '#1a1e24'); // right rail

  // Mattress
  R(bedX, bedY, bedW, bedH, '#3a4658');
  R(bedX, bedY, bedW, 4, '#4a5868');
  R(bedX, bedY + bedH - 4, bedW, 4, '#2a3542');

  // Legs
  R(bedX - 4, legY, 6, legH, '#0a0d10');
  R(bedX + bedW - 2, legY, 6, legH, '#0a0d10');
  // Cross brace
  R(bedX + 10, legY + 20, bedW - 20, 3, '#0a0d10');

  // Pillow (on left, at head of bed)
  const pillX = bedX + 10;
  const pillY = bedY - 18;
  const pillW = 62;
  const pillH = 26;
  R(pillX, pillY, pillW, pillH, '#e8e4d8');
  R(pillX, pillY, pillW, 3, '#f0ece0');
  R(pillX, pillY + pillH - 3, pillW, 3, '#c8c4b8');
  // Pillow indent
  ctx.fillStyle = 'rgba(200,196,184,0.6)';
  ctx.beginPath();
  ctx.ellipse(pillX + pillW/2, pillY + pillH/2, 24, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // ===== NANAY (lying down, head on pillow) =====
  const headCX = pillX + pillW/2;
  const headCY = pillY + 8;
  const headR = 14;

  // Hair pooled behind head (on pillow)
  ctx.fillStyle = '#1a1010';
  ctx.beginPath();
  ctx.ellipse(headCX - 14, headCY + 2, 16, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#d0a080';
  ctx.beginPath();
  ctx.ellipse(headCX, headCY, headR, 14, 0, 0, Math.PI*2);
  ctx.fill();
  // Cheek shadow
  ctx.fillStyle = 'rgba(80,40,20,0.18)';
  ctx.beginPath();
  ctx.ellipse(headCX + 6, headCY + 3, 7, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // Hair (top of head)
  ctx.fillStyle = '#1a1010';
  ctx.beginPath();
  ctx.arc(headCX, headCY - 4, headR + 1, Math.PI, Math.PI*2);
  ctx.fill();
  // Hair bun (loose, behind)
  ctx.beginPath();
  ctx.arc(headCX - 18, headCY + 2, 5, 0, Math.PI*2);
  ctx.fill();
  // Some hair strands around head
  ctx.beginPath();
  ctx.arc(headCX + 14, headCY + 4, 4, 0, Math.PI*2);
  ctx.fill();

  // Eyes (closed — sleeping)
  ctx.strokeStyle = '#0a0605'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(headCX - 7, headCY + 1);
  ctx.quadraticCurveTo(headCX - 5, headCY + 3, headCX - 3, headCY + 1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(headCX + 3, headCY + 1);
  ctx.quadraticCurveTo(headCX + 5, headCY + 3, headCX + 7, headCY + 1);
  ctx.stroke();

  // Eyebrows (soft)
  ctx.strokeStyle = 'rgba(90,60,40,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(headCX - 8, headCY - 4);
  ctx.lineTo(headCX - 3, headCY - 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(headCX + 3, headCY - 4);
  ctx.lineTo(headCX + 8, headCY - 4);
  ctx.stroke();

  // Nose (small dot)
  ctx.fillStyle = 'rgba(100,60,40,0.4)';
  ctx.fillRect(headCX, headCY + 3, 1, 2);

  // Mouth — weak smile
  ctx.strokeStyle = '#5a2828'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(headCX - 4, headCY + 8);
  ctx.quadraticCurveTo(headCX, headCY + 10, headCX + 4, headCY + 8);
  ctx.stroke();

  // Wrinkles (gentle)
  ctx.fillStyle = 'rgba(100,60,40,0.28)';
  ctx.fillRect(headCX - 9, headCY + 6, 3, 1);
  ctx.fillRect(headCX + 7, headCY + 6, 3, 1);

  // Neck
  R(headCX + 12, headCY + 6, 8, 8, '#c89878');

  // ===== BODY (under blanket) =====
  const bodyX = headCX + 18;
  const bodyY = bedY + 2;
  const bodyW = 180;
  const bodyH = bedH - 4;

  // Blanket (covers body from chest down)
  R(bodyX, bodyY, bodyW, bodyH, '#3a4858');
  R(bodyX, bodyY, bodyW, 4, '#4a5868');
  R(bodyX, bodyY + bodyH - 4, bodyW, 4, '#2a3542');
  // Blanket folds
  ctx.fillStyle = 'rgba(20,30,40,0.35)';
  ctx.fillRect(bodyX + 30, bodyY, 2, bodyH);
  ctx.fillRect(bodyX + 80, bodyY, 2, bodyH);
  ctx.fillRect(bodyX + 130, bodyY, 2, bodyH);

  // Blanket edge at chest (curved)
  ctx.fillStyle = '#4a5868';
  ctx.beginPath();
  ctx.moveTo(bodyX, bodyY);
  ctx.quadraticCurveTo(bodyX - 8, bodyY + 8, bodyX, bodyY + 10);
  ctx.lineTo(bodyX, bodyY);
  ctx.closePath();
  ctx.fill();

  // ===== ARM / HAND resting on top of blanket =====
  // Shoulder/arm visible from chest, hand on top of blanket
  const armStartX = bodyX - 6;
  const armStartY = bodyY + 8;
  // Upper arm (shoulder) — small shape under the blanket edge
  R(armStartX, armStartY, 14, 10, '#c89878');
  // Forearm going down the side of the blanket
  R(armStartX - 10, armStartY + 6, 10, 22, '#c89878');
  // Hand (open, resting on the side)
  ctx.fillStyle = '#d0a888';
  ctx.beginPath();
  ctx.ellipse(armStartX - 6, armStartY + 32, 7, 8, 0, 0, Math.PI*2);
  ctx.fill();
  // Fingers (subtle lines)
  ctx.strokeStyle = 'rgba(90,50,30,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(armStartX - 10, armStartY + 30); ctx.lineTo(armStartX - 2, armStartY + 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(armStartX - 10, armStartY + 34); ctx.lineTo(armStartX - 2, armStartY + 34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(armStartX - 10, armStartY + 38); ctx.lineTo(armStartX - 4, armStartY + 38); ctx.stroke();
  // Wrinkle/highlight on hand
  ctx.fillStyle = 'rgba(255,220,180,0.25)';
  ctx.beginPath(); ctx.ellipse(armStartX - 5, armStartY + 30, 3, 4, 0, 0, Math.PI*2); ctx.fill();

  // Blanket over arm bottom
  ctx.fillStyle = '#3a4858';
  ctx.beginPath();
  ctx.moveTo(armStartX - 12, armStartY + 42);
  ctx.lineTo(armStartX + 10, armStartY + 42);
  ctx.lineTo(armStartX + 10, armStartY + 50);
  ctx.lineTo(armStartX - 12, armStartY + 50);
  ctx.closePath();
  ctx.fill();

  // ===== MONITOR (top right) =====
  const mX = W - 100, mY = 100;
  R(mX, mY, 80, 60, '#0a1014');
  R(mX + 2, mY + 2, 76, 56, '#0a1418');
  ctx.strokeStyle = '#4ae0a0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const isFlat = G.text.full && G.text.full.includes('Bumagsak');
  if (isFlat){
    ctx.moveTo(mX + 5, mY + 30);
    ctx.lineTo(mX + 75, mY + 30);
    ctx.globalAlpha = 0.6 + Math.sin(G.time*8)*0.3;
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.moveTo(mX + 5, mY + 30);
    for (let i=0;i<8;i++){
      const x = mX + 5 + i*9;
      ctx.lineTo(x, mY + 30);
      ctx.lineTo(x + 2, mY + 20);
      ctx.lineTo(x + 4, mY + 40);
      ctx.lineTo(x + 6, mY + 30);
    }
    ctx.stroke();
  }

  // ===== IV DRIP (left) =====
  const ivX = 50, ivY = 100;
  R(ivX - 2, ivY, 4, 200, '#1a1e24');
  R(ivX - 12, ivY - 10, 24, 30, '#2a3a44');
  R(ivX - 10, ivY - 8, 20, 26, '#4a6a7a');
  ctx.fillStyle = 'rgba(180,210,220,0.5)';
  ctx.beginPath(); ctx.arc(ivX, ivY + 5, 3, 0, Math.PI*2); ctx.fill();
  // IV line going down to bed
  ctx.strokeStyle = 'rgba(200,220,230,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ivX, ivY + 30);
  ctx.quadraticCurveTo(ivX + 20, ivY + 100, ivX + 60, ivY + 180);
  ctx.stroke();

  // ===== MARCO (standing beside bed) =====
  if (hasChar('marco_adult')) drawMarco(W*0.82, H*0.88, 1.0, { mood:'sad', age:'adult' });

  // Cold vignette
  ctx.fillStyle = gradR(W/2, H/2, H*0.25, H*0.95, [[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.7)']]);
  ctx.fillRect(0,0,W,H);
}

/* ============================================================
   TEXT & UI
   ============================================================ */
function wrapText(text, x, y, maxW, lineH){
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy);
      line = w; yy += lineH;
    } else { line = test; }
  }
  if (line) ctx.fillText(line, x, yy);
}
function wrapTextCenter(text, cx, cy, maxW, lineH){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){
      lines.push(line); line = w;
    } else { line = test; }
  }
  if (line) lines.push(line);
  const totalH = lines.length * lineH;
  const startY = cy - totalH/2 + lineH/2;
  for (let i=0;i<lines.length;i++){
    ctx.fillText(lines[i], cx, startY + i*lineH);
  }
}

function drawTextBox(){
  const s = STORY[G.storyIdx];
  if (!s) return;
  if (s.isQuote || s.isFinal) return;
  const txt = G.text;
  if (!txt.full) return;
  const boxH = 140;
  const boxY = H - boxH - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, boxY, W, boxH + 10);
  ctx.fillStyle = 'rgba(200,170,150,0.20)';
  ctx.fillRect(0, boxY, W, 1);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const padX = 18;
  let textY = boxY + 16;
  if (txt.who){
    let color = '#c8b898';
    if (txt.who.includes('NANAY')) color = '#e8b890';
    else if (txt.who.includes('MARCO')) color = '#a8c0e0';
    else if (txt.who.includes('BOSES')) color = '#c0b0a0';
    else if (txt.who.includes('KATE')) color = '#e0b0d0';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = color;
    ctx.fillText(txt.who, padX, textY);
    textY += 20;
  }
  ctx.font = '14px "Courier New", monospace';
  ctx.fillStyle = '#e8dcc8';
  const shown = txt.full.slice(0, Math.floor(txt.shown));
  wrapText(shown, padX, textY, W - padX*2, 18);
  if (txt.done){
    const pulse = 0.4 + Math.sin(G.time*4)*0.4;
    ctx.textAlign = 'right';
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = `rgba(232,200,150,${pulse})`;

}

function applyPostFx(){
  const v = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.80)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
  for (let i=0;i<70;i++){
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.025})`;
    ctx.fillRect((Math.random()*W)|0, (Math.random()*H)|0, 1, 1);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  if (G.cry > 0.1){
    for (const tp of G.tears){
      ctx.fillStyle = `rgba(220,235,255,${tp.life*0.85})`;
      ctx.beginPath();
      ctx.ellipse(tp.x, tp.y, tp.size*0.7, tp.size*1.3, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
  if (G.whiteOut > 0.01){
    ctx.fillStyle = `rgba(255,255,255,${G.whiteOut})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function updateText(dt){
  const txt = G.text;
  if (!txt.full) return;
  if (txt.shown >= txt.full.length){ txt.done = true; return; }
  txt.charT += dt;
  const speed = 1/35;
  while (txt.charT > speed && txt.shown < txt.full.length){
    txt.charT -= speed;
    txt.shown++;
    const c = txt.full[Math.floor(txt.shown)-1];
    if (c && c !== ' ' && c !== '.' && c !== ',' && c !== '"' && c !== '\'' && c !== '—'){
      blip(500 + Math.random()*300, 0.005);
    }
    if (txt.shown >= txt.full.length) txt.done = true;
  }
}

function updateTears(dt){
  if (G._faceX !== null && G._faceX !== undefined && G.cry > 0.12){
    const rate = 3 + G.cry * 12;
    if (Math.random() < rate * dt){
      const side = Math.random() < 0.5 ? -1 : 1;
      G.tears.push({
        x: G._faceX + side * G._eyeSpacing + (Math.random()-0.5)*1.5,
        y: G._faceY + 2 + Math.random()*1.5,
        vy: 12 + Math.random()*18,
        life: 1, size: 0.7 + Math.random()*0.9,
      });
    }
  }
  for (let i = G.tears.length-1; i>=0; i--){
    const tp = G.tears[i];
    tp.y += tp.vy * dt; tp.vy += 22 * dt; tp.life -= dt * 0.6;
    if (tp.life <= 0 || tp.y > H){ G.tears.splice(i,1); }
  }
}

function updateFx(dt){
  if (G.cry < G.cryTarget) G.cry = Math.min(G.cryTarget, G.cry + dt*0.5);
  else if (G.cry > G.cryTarget) G.cry = Math.max(G.cryTarget, G.cry - dt*0.5);
  G.shake *= Math.pow(0.001, dt);
  G.whiteOut *= Math.pow(0.3, dt);
  if (G.fade !== G.fadeTarget){
    const dir = Math.sign(G.fadeTarget - G.fade);
    G.fade += dir * G.fadeSpeed * dt;
    if ((dir > 0 && G.fade > G.fadeTarget) || (dir < 0 && G.fade < G.fadeTarget)){
      G.fade = G.fadeTarget;
    }
  }
}

/* ============================================================
   STORY RUNNER
   ============================================================ */
function loadStory(idx){
  if (idx >= STORY.length){
    G.phase = 'end';
    return;
  }
  G.storyIdx = idx;
  const s = STORY[idx];
  const prevScene = G.scene;

  // When phone call arrives (rainNight) — start blk.mp3, kill procedural BGM
  if (s.sc === 'rainNight' && !G.realMusicPhase){
    G.realMusicPhase = true;
    RealMusic.startA();
  }

  if (s.sc !== prevScene){
    G.scene = s.sc;
    G.fade = 1;
    G.fadeTarget = 0;
    G.fadeSpeed = 1.2;
    if (prevScene !== 'menu') setTimeout(()=>sceneTransition(), 200);
  }

  if (!G.realMusicPhase && s.bgm){
    BGM.play(s.bgm);
  }

  if (s.sfx) setTimeout(()=>playNamedSFX(s.sfx), 300);
  if (s.sc === 'hospital'){
    if (s.txt && (s.txt.includes('Bumagsak') || s.txt.includes('huling beses'))){
      G.cryTarget = 0.8;
    }
    if (s.txt && s.txt.includes('huling beses')){
      G.whiteOut = 0.3;
    }
  }
  if (s.sc === 'letters') G.cryTarget = 0.5;
  if (s.sc === 'grave') G.cryTarget = 0.3;
  if (s.sc === 'sunrise') G.cryTarget = 0;
  G.text.who = s.who || '';
  G.text.full = s.txt || '';
  G.text.shown = 0;
  G.text.charT = 0;
  G.text.done = false;
}

function nextStory(){
  if (G.storyIdx >= STORY.length - 1){
    G.phase = 'end';
    return;
  }
  loadStory(G.storyIdx + 1);
}

function startStory(){
  G.phase = 'story';
  loadStory(0);
}

/* ============================================================
   INPUT
   ============================================================ */
function canvasPos(cx, cy){
  const r = canvas.getBoundingClientRect();
  return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H };
}
function handleTap(x, y){
  if (!audioCtx) initAudio();
  if (G.phase === 'menu'){
    const bx = W/2 - 90, by = H*0.86, bw = 180, bh = 46;
    if (x >= bx && x <= bx+bw && y >= by && y <= by+bh){
      startStory();
    }
    return;
  }
  if (G.phase === 'story'){
    const s = STORY[G.storyIdx];
    if (!s) return;
    if (!G.text.done){
      G.text.shown = G.text.full.length;
      G.text.done = true;
      return;
    }
    nextStory();
  }
}

canvas.addEventListener('mousedown', e=>{
  const p = canvasPos(e.clientX, e.clientY);
  handleTap(p.x, p.y);
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  if (!audioCtx) initAudio();
  for (const t of e.changedTouches){
    const p = canvasPos(t.clientX, t.clientY);
    handleTap(p.x, p.y);
  }
}, { passive: false });
addEventListener('keydown', e=>{
  if (!audioCtx) initAudio();
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    handleTap(W/2, H/2);
  }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

   DRAW LOOP
   ============================================================ */
function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  if (G.shake > 0.1){
    ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  }
  drawScene();
  ctx.restore();
  if (G.phase === 'story'){
    const s = STORY[G.storyIdx];
    if (s){
      if (s.isQuote) drawQuote();
      else if (s.isFinal) drawFinal();
      else drawTextBox();
    }
  }
  applyPostFx();
  if (G.fade > 0.01){
    ctx.fillStyle = `rgba(0,0,0,${G.fade})`;
    ctx.fillRect(0,0,W,H);
  }
  if (G.phase === 'end'){
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px "Courier New", monospace';
    const p = 0.5 + Math.sin(G.time*2)*0.5;
    ctx.fillStyle = `rgba(232,216,184,${0.7 + p*0.3})`;
    ctx.fillText('WAKAS', W/2, H*0.45);
    ctx.font = 'italic 11px "Courier New", monospace';
    ctx.fillStyle = 'rgba(180,160,140,0.8)';
    ctx.fillText('Adrian Suarez', W/2, H*0.55);
  }
}

/* ============================================================
   LOOP
   ============================================================ */
let lastT = performance.now();
function loop(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;
  G.time += dt;
  updateText(dt);
  updateTears(dt);
  updateFx(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   FIRST GESTURE
   ============================================================ */
RealMusic.init();
let unlocked = false;
function unlockAudio(){
  if (unlocked) return;
  unlocked = true;
  initAudio();
  BGM.init();
  BGM.play('menu');
}
['click','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, { once: true });
});

</script>
